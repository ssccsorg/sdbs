project:
  type: website
  post-render:
    - 'find . -type d -name "figure-pdf" -exec rm -rf {} + -o -name "figure-beamer" -exec rm -rf {} + -o -name "mediabag" -exec rm -rf {} +'

website:
  site-url: https://example.org/publish-test
  repo-url: https://github.com/example/publish-test
  repo-subdir: docs
  repo-actions: [edit, issue]
  llms-txt: true
  sidebar:
    collapse-level: 1
    contents:
      - href: index.qmd
        text: "Home"
      - auto: "*.{qmd,md}"

page-footer:
  left: "© Publish Test Contributors"
  right:
    - icon: github
      href: https://github.com/example/publish-test

metadata-files:
  - ./_include/format.html.yml
  - ./_include/format.pdf.yml

format:
  html:
    directory-index: true
