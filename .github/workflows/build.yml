# Build pipeline
#
# 1. Build the Docker image (no push).
# 2. Test against the freshly built image.
# 3. Only if all tests pass, push the image to the registry.

name: build

on:
  push:
    branches: ["main"]
    paths:
      - "Dockerfile"
      - "pyproject.toml"
      - "src/**"
      - "tests/**"
      - ".github/workflows/**"
  pull_request:
    branches: ["main"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ssccsorg/sdbs

permissions:
  contents: read
  packages: write

concurrency:
  group: "docker-image"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            dockerfile:
              - 'Dockerfile'

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        if: steps.filter.outputs.dockerfile == 'true'
        uses: docker/build-push-action@v7
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
          DOCKER_BUILD_SUMMARY: false
        with:
          context: .
          file: Dockerfile
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:test-build
          load: true
          cache-from: type=gha,scope=shared-sdbs
          cache-to: type=gha,mode=min,scope=shared-sdbs
          provenance: false
          sbom: false

      - name: Determine test image
        id: test-image
        run: |
          if [ "${{ steps.filter.outputs.dockerfile }}" = "true" ]; then
            echo "name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:test-build" >> "$GITHUB_OUTPUT"
          else
            echo "name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Pull existing image
        if: steps.filter.outputs.dockerfile != 'true'
        run: docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

      - name: Run all test suites
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/work \
            -w /work \
            -e PYTHONPATH=/work/src \
            ${{ steps.test-image.outputs.name }} \
            bash -c "./tests/run.sh"

      - name: Push Docker image
        if: github.ref == 'refs/heads/main' && github.event_name == 'push' && steps.filter.outputs.dockerfile == 'true'
        run: |
          docker tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:test-build ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
