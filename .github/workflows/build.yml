# Build pipeline
#
# 1. Run all test suites (unit + production workflow).
# 2. Only if all tests pass, build and push the Docker image.
#
# A failing test blocks publishing -- tested code must never ship broken.

name: build

on:
  push:
    branches: ["main"]
    paths:
      - "Dockerfile"
      - "pyproject.toml"
      - "src/**"
      - "tests/**"
      - ".github/workflows/**"
  pull_request:
    branches: ["main"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ssccsorg/sdbs

permissions:
  contents: read
  packages: write

concurrency:
  group: "docker-image"
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    container: ghcr.io/ssccsorg/sdbs:latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Run all test suites
        run: ./tests/run.sh

  build:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
          DOCKER_BUILD_SUMMARY: false
        with:
          context: .
          file: Dockerfile
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          push: true
          cache-from: type=gha,scope=shared-sdbs
          cache-to: type=gha,mode=min,scope=shared-sdbs
          provenance: false
          sbom: false
