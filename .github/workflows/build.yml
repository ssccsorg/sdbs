# Build pipeline
#
# 1. Build the Docker image with layer caching via buildx.
# 2. Run all test suites inside the built image.
# 3. On main branch, push the image to the registry.

name: build

on:
  push:
    branches: ["main"]
    paths:
      - "Dockerfile"
      - "pyproject.toml"
      - "src/**"
      - "tests/**"
      - ".github/workflows/**"
  pull_request:
    branches: ["main"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ssccsorg/sdbs

permissions:
  contents: read
  packages: write

concurrency:
  group: "docker-image"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        uses: docker/build-push-action@v7
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
          DOCKER_BUILD_SUMMARY: false
        with:
          context: .
          file: Dockerfile
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:test-build
          load: true
          cache-from: type=gha
          provenance: false
          sbom: false

      - name: Run all test suites
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/work \
            -w /work \
            -e PYTHONPATH=/work/src \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:test-build \
            bash -c "./tests/run.sh"

      - name: Push Docker image
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          docker tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:test-build \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
