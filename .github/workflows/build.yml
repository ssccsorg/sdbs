name: Build and Publish SDBS Image

on:
  push:
    branches: ["main"]
    paths:
      - "Dockerfile"
      - "NOTICE.md"
      - "pyproject.toml"
      - "src/**"
      - "tests/**"
      - ".github/workflows/**"
  pull_request:
    branches: ["main"]
    paths:
      - "Dockerfile"
      - "NOTICE.md"
      - "pyproject.toml"
      - "src/**"
      - "tests/**"
      - ".github/workflows/**"
  workflow_dispatch:

concurrency:
  group: "sdbs-image"
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ssccsorg/sdbs

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        uses: docker/build-push-action@v7
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
          DOCKER_BUILD_SUMMARY: false
        with:
          context: .
          file: Dockerfile
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:test-build  
          load: true
          cache-from: type=gha,scope=shared-sdbs
          cache-to: type=gha,mode=min,scope=shared-sdbs
          provenance: false
          sbom: false

      - name: Run all test suites
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/work \
            -w /work \
            -e PYTHONPATH=/work/src \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:test-build \
            bash -c "./tests/run.sh"

      - name: Push Docker image
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          docker tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:test-build ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
