# Test suite frontend
#
# Runs all test suites under tests/ via tests/run.sh:
#   1. Python unit tests (pytest)
#   2. Production workflow test (sdb build docs --website on real ssccs repo)
#
# Pass = production build is verified end-to-end + unit tests pass.

name: test

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    container: ghcr.io/ssccsorg/sdbs:latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Run all test suites
        run: ./tests/run.sh
