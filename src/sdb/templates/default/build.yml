# SDBS Build Configuration
# This file is read by SDBS at build time to discover targets,
# apply target-specific overrides, and execute pre/post hooks.
# Place this file in your docs root directory.

# Target-specific configurations (optional)
# Each key is a target name (auto-discovered from .qmd/.md files).
# Settings here override the defaults for that target only.
target_config: {}

# Pre-build commands: executed before any Quarto rendering begins.
# Supports _global (always runs) and target-specific entries.
# If the executable is not found on PATH, the command is skipped.
# If a command fails, a warning is logged but the build continues.
pre_build:
  _global: []

# Post-render commands: executed after all targets have been rendered
# and merged into the final _site/ directory.
# Same format and error handling as pre_build.
post_render:
  _global: []

# Exclude patterns (gitignore-style)
# Files and directories matching these patterns are excluded from
# target discovery. They will not be built or processed.
# Supports:
#   Glob patterns:   **/*.md, **/README.md
#   Directory only:  **/_include/, **/*_libs/  (trailing slash)
#   Simple names:    README.md, contributing.md
exclude:
  # Ignore top-level README files (not part of the documentation).
  - "**/README.md"
  # LLM-friendly .llms.md files are generated by the build, not built.
  - "**/*.llms.md"
  - "**/llms.txt"

  # Directory patterns (trailing slash indicates a directory).
  - "**/_include/"
  - "**/_extensions/"
  - "**/_utils/"
  - "**/*_output/"
  - "**/*_files/"
  - "**/*_cached/"
  - "**/*_libs/"
  - "**/*_pages/"
  # Jupyter cache created during code cell execution.
  - "**/.jupyter_cache"

# Metadata checks (optional)
# The pre-build metadata step writes the LaTeX file a document's title page
# inputs, from the front matter keys it resolves: version-prefix, version-mark,
# author (name, email, role, orcid) and affiliations (name, url, domain).  It
# heals the mismatches between those declarations and what the Quarto render
# needs, mostly on the PDF path.  No project script and no pre-render hook are
# involved: the step runs for sdb pre, sdb build, sdb render, and sdb pub.
#
# Every check is a named case.  Switch one off under "disabled", or hold back
# every repair at once with "report_only".  An unknown name is reported with
# the list below, so a typo does not silently leave a case on.
#
#   document-outside-root             report   a document resolving out of the docs root
#   input-missing                     report   a header input nothing here creates
#   reference-missing                 repair   insert the \input line a header needs
#   invalid-front-matter              report   front matter that does not parse
#   declared-metadata-missing         report   a metadata-files entry the tree lacks
#   affiliation-url-from-author-key   repair   take the url the author entry declares
#   affiliation-url-from-domain       repair   url := https://<domain>
#   affiliation-domain-from-url       repair   domain := the host of the url
#   affiliation-blank                 report   a link the header cannot fill
#   reference-outside-root            report   a reference resolving out of the root
#   shared-target                     report   several documents on one generated file
#   metadata-file-missing-or-stale    repair   write the generated file
metadata:
  disabled: []
  report_only: false
