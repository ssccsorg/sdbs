# SSCCS Documentation Build Configuration
# This file externalizes target-specific configurations and exclude patterns.

# Target-specific configurations (optional)
# These settings override defaults for specific targets.
# If a target is not listed here, it will still be built with default settings.
target_config: []

  # Example: target with HTML copy enabled
  # manifesto:
  #   c2pa: false
  #   copy_html: true
  #   copy_pdf: false
  #   copy_md: false
  #   output_dir: false
  #   to: null

# Pre-build commands
# Commands to execute before the build process begins.
#
# Format (dict-style, recommended):
#   _global:                  # Commands always executed once before any target
#     - [executable, arg1, ...]
#   target-name:              # Commands executed only for a specific target
#     - [executable, arg1, ...]
#
# Old format (list-style, still supported for backward compatibility):
#   - [executable, arg1, ...]  # All commands treated as global
#
# If the executable is not found on PATH, the command is silently skipped.
# If a command fails, an error is logged but the main build process continues.
pre_build:
  _global: []

# Post-render commands
# Commands to execute after all targets have been rendered and merged.
#
# Same format as pre_build. Useful for:
#   - Generating hierarchical llms.txt from the output directory structure
#   - Post-processing merged site artifacts
#   - Running validation or aggregation scripts
#
# If the executable is not found on PATH, the command is silently skipped.
# If a command fails, an error is logged but the build is considered successful.
post_render:
  _global: []

# Exclude patterns (gitignore-style)
# Files and directories matching these patterns will be excluded from target discovery.
# Supports:
#   - Glob patterns: **/*.md, **/README.md
#   - Directory patterns: **/_include/, **/*_libs/
#   - Simple patterns: README.md, contributing.md
exclude:
  - "**/README.md"
  - "**/*.llms.md"
  - "**/llms.txt"

  # Directory patterns (trailing slash indicates directory)
  - "**/_include/"
  - "**/_extensions/"
  - "**/_utils/"
  - "**/*_output/"
  - "**/*_files/"
  - "**/*_cached/"
  - "**/*_libs/"
  - "**/*_pages/"
  - "**/.jupyter_cache"

# Metadata checks (optional)
# The pre-build metadata step writes the LaTeX file a document's title page
# inputs, from the front matter keys it resolves: version-prefix, version-mark,
# author (name, email, role, orcid) and affiliations (name, url, domain).  It
# heals the mismatches between those declarations and what the Quarto render
# needs, mostly on the PDF path.  No project script and no pre-render hook are
# involved: the step runs for sdb pre, sdb build, sdb render, and sdb pub.
#
# Every check is a named case.  Switch one off under "disabled", or hold back
# every repair at once with "report_only".  An unknown name is reported with
# the list below, so a typo does not silently leave a case on.
#
#   document-outside-root             report   a document resolving out of the docs root
#   input-missing                     report   a header input nothing here creates
#   reference-missing                 repair   insert the \input line a header needs
#   reference-unguarded               repair   put that line behind \IfFileExists
#   invalid-front-matter              report   front matter that does not parse
#   declared-metadata-missing         report   a metadata-files entry the tree lacks
#   affiliation-url-from-author-key   repair   take the url the author entry declares
#   affiliation-url-from-domain       repair   url := https://<domain>
#   affiliation-domain-from-url       repair   domain := the host of the url
#   affiliation-blank                 report   a link the header cannot fill
#   reference-outside-root            report   a reference resolving out of the root
#   shared-target                     report   several documents on one generated file
#   metadata-file-missing-or-stale    repair   write the generated file
metadata:
  disabled: []
  report_only: false
