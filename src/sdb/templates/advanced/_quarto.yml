# Shared
# There is no project pre-render hook.  The LaTeX metadata file a title page
# consumes is written by sdbs's pre-build sequence, so it is generated for
# sdb build, sdb pre, sdb render, and sdb pub without a project script.  A
# header that inputs it behind \IfFileExists, declaring the macros it uses in
# the other branch, still renders without sdbs.  See the metadata block in
# build.yml for the checks that sequence applies.
csl: _include/ieee.csl
link-citations: true
execute:   
  cache: true
  echo: false